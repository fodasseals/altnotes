name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Garantir chave fixa para permitir atualizacao do APK
        run: |
          if [ ! -f ".github/debug.keystore" ]; then
            keytool -genkey -v -keystore .github/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add .github/debug.keystore
            git commit -m "Chave fixa de assinatura do APK [skip ci]"
            git push
          fi
          mkdir -p ~/.android
          cp .github/debug.keystore ~/.android/debug.keystore

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK 27.0.12077973
        run: |
          yes | sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: altnotes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
